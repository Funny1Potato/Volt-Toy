[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-volt-toy"
version = "0.1.0"
description = "电击群友：电压 / 电量 / 度数记账，供电局文案"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Volt-Toy" }]
keywords = ["nonebot", "plugin", "chat", "game"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Nonebot",
    "Operating System :: OS Independent",
]
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-plugin-alconna>=0.55.0",
    "nonebot-plugin-uninfo>=0.8.0",
    "nonebot-plugin-localstore>=0.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["volt_toy_core", "nonebot_plugin_volt_toy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.nonebot]
plugin_type = "application"
plugins = ["nonebot_plugin_volt_toy"]
upstream_url = "https://github.com/your-name/Volt-Toy"
