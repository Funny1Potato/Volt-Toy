[project]
name = "nonebot-plugin-volt-toy"
dynamic = ["version"]
description = "电击群友：电压 / 电量 / 度数记账，失败计数，供电局文案"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "MIT" }
authors = [{ name = "Volt-Toy" }]
keywords = ["nonebot", "nonebot2", "plugin", "chat", "game", "zap"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-plugin-alconna>=0.55.0",
    "nonebot-plugin-uninfo>=0.8.0",
    "nonebot-plugin-localstore>=0.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "nonebot_plugin_volt_toy/__init__.py"

[tool.hatch.build.targets.wheel]
# 插件与内核一起打包：volt_toy_core 只依赖标准库，随插件发布最省事
packages = ["nonebot_plugin_volt_toy", "volt_toy_core"]

[tool.hatch.build.targets.sdist]
# AstrBot 的入口文件不进 Python 包
exclude = [
    "main.py",
    "metadata.yaml",
    "_conf_schema.json",
    "doc",
    "dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.nonebot]
plugin_type = "application"
plugins = ["nonebot_plugin_volt_toy"]
upstream_url = "https://github.com/Funny1Potato/Volt-Toy"
